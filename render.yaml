# Render Blueprint: one free web service. Secrets are entered in Render's dashboard (sync: false).
services:
  - type: web
    name: dm-tool
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GRAPH_HOST
        value: graph.facebook.com
      - key: GRAPH_VERSION
        value: v27.0
      - key: MONGODB_URI
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: ADMIN_API_KEY
        sync: false
